# Fly.io app definition for the Resonance live product server.
#
# Quick start (see ops/DEPLOY.md for the full runbook):
#   fly launch --no-deploy --copy-config --name <app>      # creates the app
#   fly postgres create --name <app>-db                    # or bring your own DSN
#   fly postgres attach <app>-db                           # sets DATABASE_URL
#   fly secrets set RESONANCE_CONFIRMATION_SECRET="$(openssl rand -hex 32)"
#   fly secrets set PUBLIC_ORIGIN="https://<app>.fly.dev"
#   fly deploy
#
# RESONANCE_DB is read from DATABASE_URL by the start command below, so the
# attached Fly Postgres works with no further wiring.

app = "resonance-live"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Populated by `fly postgres attach` as DATABASE_URL; mirrored into
  # RESONANCE_DB at container start by the command override below.

[processes]
  app = "sh -c 'exec python3 -m src.product.server --host 0.0.0.0 --port \"$PORT\" --db \"${RESONANCE_DB:-$DATABASE_URL}\" --origin \"$PUBLIC_ORIGIN\" $EXTRA_ORIGINS'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # a single always-on machine keeps the pilot warm
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/product/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
