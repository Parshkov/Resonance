  # ---- R18: evidence and scale (active milestone, opened 2026-09-06) -------
  # `issue: null` is honest, not an oversight: no GitHub Issue exists for these
  # yet. Opening one is a maintainer action, and until it exists the claim
  # protocol has nowhere to record a CLAIM -- so treat these as PLANNED and ask
  # before starting canonical work on them.

  - run_id: R18-A-EMBEDDING-BASELINE
    issue: null
    mission_file: null
    contract: engineering/MISSION_CONTRACT.md
    output_pattern: "benchmark/baselines/**; report beside src/engine/reports/**"
    recommended_model: best_available_coding_agent
    claim_mode: exclusive
    repeat_policy: allowed_after_unique_run_id
    blind_group: null
    prerequisites: []
    phase: R18
    note: >-
      The falsification test the project set itself. WHY_NOT.md rejects
      whole-thought embeddings and ADR-0004 names "the lexicon channel adds
      nothing over whole-thought embeddings" as the condition for
      reconsidering. Never run. Must report engine 0.2 and the baseline on the
      same v0.2 pairs, with the gate split kept separate.

  - run_id: R18-B-SCALE-REPLAY
    issue: null
    mission_file: null
    contract: engineering/MISSION_CONTRACT.md
    output_pattern: "benchmark/scale/**; engine profiling report"
    recommended_model: best_available_coding_agent
    claim_mode: exclusive
    repeat_policy: allowed_after_unique_run_id
    blind_group: null
    prerequisites: []
    phase: R18
    note: >-
      Replay the concept channel at 10^4-10^5 graphs. Measured 2026-09-06 on
      the v0.2 corpus replicated in memory: 148 ms at 176 graphs, 170 ms at
      352, 283 ms at 704, 580 ms at 1408 -- linear from 352 up, which is the
      reconsideration condition in ADR-0004. Note that
      ResonanceEngine._require_bound() re-hashes the whole corpus per query.

  - run_id: R18-C-HUMAN-GOLD-REVIEW
    issue: null
    mission_file: null
    contract: engineering/MISSION_CONTRACT.md
    output_pattern: "benchmark/r0-v0.2 gold review record; ADR-0005 resolution"
    recommended_model: human_review
    claim_mode: coordinator
    repeat_policy: review_only
    blind_group: null
    prerequisites: []
    phase: R18
    note: >-
      Every v0.2 gold label and every benchmark graph is agent-authored, and
      the manifest marks gold review as pending. No external claim about
      classification accuracy should outlive this. ADR-0005 is explicitly
      waiting on it and must not be settled by moving a threshold.

  - run_id: R18-D-REAL-CORPUS
    issue: null
    mission_file: null
    contract: engineering/MISSION_CONTRACT.md
    output_pattern: "consented real-thought corpus; two-human gold; comparison report"
    recommended_model: human_agent_orchestration
    claim_mode: exclusive
    repeat_policy: allowed_after_unique_run_id
    blind_group: null
    prerequisites:
      - R18-C-HUMAN-GOLD-REVIEW
    phase: R18
    note: >-
      ADR-0006 measured the lexicon at 0.00-0.07 on real thought pairs. Consent
      is a hard precondition; see docs/PRIVACY_AND_DATA_USE.md.

  - run_id: R18-E-CI
    issue: null
    mission_file: null
    contract: engineering/MISSION_CONTRACT.md
    output_pattern: ".github/workflows/**"
    recommended_model: best_available_coding_agent
    claim_mode: exclusive
    repeat_policy: allowed_after_unique_run_id
    blind_group: null
    prerequisites: []
    phase: R18
    note: >-
      The repository ran 396 commits with no CI. A workflow was added in the
      2026-09-06 audit but has never executed on a pull request. This slot
      closes when a PR check has actually run and is required.
