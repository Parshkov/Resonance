<!doctype html>
<html lang="en" data-theme="light" data-theme-choice="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resonance</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Applies the viewer's colour scheme before the first paint. -->
  <script src="/theme.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- The frame is static. What changes is #view, one screen at a time:
       Home, My thoughts, People, Conversations, Groups, Connect a chat.
       main.mjs owns the navigation and every screen; store.mjs owns the
       state; strings.mjs owns every sentence, in two languages. -->
  <div class="app-shell" id="app-shell" data-state="loading">
    <header class="masthead">
      <h1 class="brand-title">
        <a class="brand" href="/" data-link="1" aria-label="Resonance">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="wordmark">Resonance</span>
        </a>
      </h1>
      <nav class="page-nav" id="page-nav" aria-label="Sections"></nav>
      <div class="masthead-tools">
        <!-- Stamped by the server so the first paint already shows who you are. -->
        <div class="account-slot" id="account-slot"></div>
      </div>
    </header>

    <div class="notice" id="notice" role="alert" hidden></div>

    <main class="view" id="view" tabindex="-1"></main>

    <footer class="page-foot">
      <div class="foot-identity">
        <p class="foot-name"><span class="brand-mark" aria-hidden="true"></span>Resonance</p>
        <p class="foot-claim" id="foot-claim">The match is computed, not judged: no language model decides who resonates with you, and you are shown the working.</p>
      </div>
      <nav class="foot-nav" aria-label="Footer">
        <ul>
          <li><a href="/privacy" id="foot-privacy">Privacy</a></li>
          <li><a href="/terms" id="foot-terms">Terms</a></li>
          <li><a href="/support" id="foot-support">Support</a></li>
        </ul>
      </nav>
      <!-- Where the browser WebMCP modules report what this browser can do.
           Shown on the Connect page, where it is about the browser. -->
      <div id="tool-home" hidden><div class="tool-status" id="tool-status" hidden></div></div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="/main.mjs"></script>
</body>
</html>
