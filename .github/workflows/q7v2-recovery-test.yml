name: Q7V2 Recovery Test

on:
  push:
    branches:
      - agent/parshkov-openai-gpt5-codex-q7v2/R6-MCP-REPEAT-Q7V2-recovery-final
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted MCP tests
        run: python -m unittest tests.test_mcp_adapter -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
